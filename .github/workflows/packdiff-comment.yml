name: API comment

# Posts the output of the API workflow as a PR comment, and updates the
# same comment on later runs. A pull_request workflow cannot comment on PRs
# from forks, its token is read-only. This workflow runs in the context of
# the base repository and does not check out or run any PR code, it only
# reads the uploaded output.

on:
  workflow_run:
    workflows: [API]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: "Post the API diff"
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Download the packdiff output
      uses: actions/download-artifact@v4
      with:
        name: packdiff-output
        path: packdiff-output
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    # A diff longer than maxLines is not included in the comment, only its
    # summary and a link to the job summary of the run, which has the full
    # output.
    - name: Post or update the PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const dir = 'packdiff-output';
          const marker = '<!-- packdiff-api-diff -->';
          const maxLines = 50;
          const packages = ['streamly-core', 'streamly'];
          const run = context.payload.workflow_run;

          const pr = Number(fs.readFileSync(`${dir}/pr-number`, 'utf8').trim());
          if (!Number.isInteger(pr) || pr <= 0) {
            core.setFailed(`Invalid PR number in ${dir}/pr-number`);
            return;
          }

          function fence(text) {
            return '````\n' + text + '\n````';
          }

          // The summary is the last paragraph of the packdiff output.
          function section(pkg) {
            const file = `${dir}/${pkg}.txt`;
            const text =
              fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trimEnd() : '';
            if (text === '') {
              return `**${pkg}**: packdiff failed, see the [CI run](${run.html_url}).`;
            }
            if (text === 'No API changes.') {
              return `**${pkg}**: no API changes.`;
            }
            const summary = text.split('\n\n').pop();
            const head = `### ${pkg}\n\n` + fence(summary) + '\n\n';
            if (text.split('\n').length > maxLines) {
              return head + 'The full diff is in the '
                + `[job summary](${run.html_url}).`;
            }
            return head + '<details><summary>Full diff</summary>\n\n'
              + fence(text) + '\n\n</details>';
          }

          const body = [
            marker,
            `## API changes in ${run.head_sha}`,
            ...packages.map(section)
          ].join('\n\n');

          const {owner, repo} = context.repo;
          const comments = await github.paginate(
            github.rest.issues.listComments,
            {owner, repo, issue_number: pr});
          const old = comments.find(c =>
            c.user.type === 'Bot' && c.body.startsWith(marker));
          if (old) {
            await github.rest.issues.updateComment(
              {owner, repo, comment_id: old.id, body});
          } else {
            await github.rest.issues.createComment(
              {owner, repo, issue_number: pr, body});
          }
