name: API

on:
  workflow_dispatch:
  pull_request:

jobs:
  packdiff:
    name: "Signature diff: master vs PR"
    env:
      GHCVER: 9.8.4
      GHCUP_VERSION: 0.1.50.2

    runs-on: ubuntu-latest

    steps:

    # This should happen before cache restore.
    - name: Remove ~/.ghcup symlink
      run: |
        rm -f ~/.ghcup

    # Saved by the TEST workflow on master
    - name: Restore ghcup and ghc
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.ghcup
        key: ghc-${{ env.GHCVER }}-v-ubuntu-latest

    # Saved by the TEST workflow on master, "cabal update" updates it.
    - name: Restore hackage package index
      uses: actions/cache/restore@v4
      with:
        path: |
            ~/.cache/cabal/packages
        key: cabal-hackage-index

    - name: Cache packdiff (non-Windows)
      uses: actions/cache@v4
      if: runner.os != 'Windows'
      with:
        path: |
            ~/.local/bin
            ~/.local/state/cabal
        # The packdiff commit is in cabal.project.packdiff, changing it
        # installs the new packdiff.
        key: packdiff-ghc-${{ env.GHCVER }}-${{ hashFiles('cabal.project.packdiff') }}

    - name: Checkout the current branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    # Use a sane PATH, especially to pick the right GHC
    - name: Set PATH to add .local and .ghcup
      run: echo "$HOME/.local/bin:$HOME/.ghcup/bin:/bin:/usr/bin" > $GITHUB_PATH

    - name: Download ghc
      run: |
        if ! ghc --version 2>/dev/null | grep -q "$GHCVER" || ! command -v cabal
        then
          curl -sL -o ./ghcup https://downloads.haskell.org/~ghcup/$GHCUP_VERSION/x86_64-linux-ghcup-$GHCUP_VERSION
          chmod +x ./ghcup
          export GHCUP_INSTALL_BASE_PREFIX=$HOME
          ./ghcup install ghc $GHCVER
          ./ghcup set ghc $GHCVER
          ./ghcup install cabal
        fi
        # XXX update only if not present
        cabal update

    - name: Install packdiff
      run: |
        if [ ! -f $HOME/.local/bin/packdiff ]; then
          mkdir -p $HOME/.local/bin
          # IMPORTANT: do not replace $HOME with ~, tilde is not expanded by
          # shell in the middle of a command string.
          cabal install packdiff --project-file=cabal.project.packdiff --installdir=$HOME/.local/bin --overwrite-policy=always
        fi

    # The output is posted as a PR comment by packdiff-comment.yml, which
    # finds the PR from the pr-number file.
    - name: Create the packdiff output directory
      run: |
        mkdir -p packdiff-output
        echo "${{ github.event.pull_request.number }}" > packdiff-output/pr-number

    # The job summary is limited to 1 MiB per step.
    - name: Run packdiff on streamly-core
      shell: bash
      run: |
        out=packdiff-output/streamly-core.txt
        packdiff diff --color never -p streamly-core \
          ${{ github.event.pull_request.base.sha }} \
          ${{ github.event.pull_request.head.sha }} | tee $out
        { echo "## streamly-core"; echo; echo '````'
          head -c 1000000 $out; echo '````'
        } >> $GITHUB_STEP_SUMMARY

    - name: Run packdiff on streamly
      shell: bash
      run: |
        out=packdiff-output/streamly.txt
        packdiff diff --color never -p streamly \
          ${{ github.event.pull_request.base.sha }} \
          ${{ github.event.pull_request.head.sha }} | tee $out
        { echo "## streamly"; echo; echo '````'
          head -c 1000000 $out; echo '````'
        } >> $GITHUB_STEP_SUMMARY

    - name: Upload the packdiff output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: packdiff-output
        path: packdiff-output/
